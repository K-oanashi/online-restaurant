
{% load static %}
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>რეგისტრაცია | ცისფერი მთები</title>

    <link href="{% static 'restaurant/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'restaurant/css/style.css' %}" rel="stylesheet">
</head>
<body>

<div class="container-fluid bg-dark py-3">
    <div class="container">
        <a href="{% url 'home' %}" class="text-primary text-decoration-none">
            <h2>ცისფერი მთები</h2>
        </a>
    </div>
</div>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <h1 class="text-center mb-4">რეგისტრაცია</h1>

            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>

                        <div>{{ field }}</div>

                        {% if field.errors %}
                            <div class="text-danger">
                                {{ field.errors }}
                            </div>
                        {% endif %}

                        {% if field.help_text %}
                            <small class="text-muted">
                                {{ field.help_text }}
                            </small>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary w-100">
                    რეგისტრაცია
                </button>
            </form>

            <p class="text-center mt-3">
                უკვე გაქვთ ანგარიში?
                <a href="{% url 'login' %">შესვლა</a>
            </p>

        </div>
    </div>

</div>

</body>
</html>
