
{% load static %}
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>შესვლა | ცისფერი მთები</title>

    <link href="{% static 'restaurant/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'restaurant/css/style.css' %}" rel="stylesheet">
</head>
<body>

<div class="container-fluid bg-dark py-3">
    <div class="container">
        <a href="{% url 'home' %}" class="text-primary text-decoration-none">
            <h2>ცისფერი მთები</h2>
        </a>
    </div>
</div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h1 class="text-center mb-4">შესვლა</h1>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <p class="text-danger">
                        მომხმარებლის სახელი ან პაროლი არასწორია.
                    </p>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label">მომხმარებლის სახელი</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">პაროლი</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    შესვლა
                </button>
            </form>

            <p class="text-center mt-3">
                არ გაქვთ ანგარიში?
                <a href="{% url 'register' %}">რეგისტრაცია</a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
